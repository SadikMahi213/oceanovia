<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upload Too Large</title>
<style>
body{margin:0;background:#f3f4f6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{background:#fff;border-radius:16px;box-shadow:0 4px 16px rgba(0,0,0,.06);padding:40px;max-width:440px;margin:16px;text-align:center}
h1{margin:0 0 12px;font-size:22px;color:#111827}
p{margin:0 0 16px;font-size:15px;line-height:1.7;color:#374151}
.btn{display:inline-block;background:#4f46e5;color:#fff;padding:10px 20px;border-radius:10px;text-decoration:none;font-size:14px}
</style>
</head>
<body>
<div class="card">
<h1>Upload failed</h1>
<p>Your upload was too large and could not be sent. Please reduce the file size (maximum 2 MB per image, 8 MB total) and try again, or contact support at <a href="mailto:support@oceanovia.com">support@oceanovia.com</a>.</p>
<a class="btn" href="javascript:history.back()">Go back</a>
</div>
</body>
</html>
