# deploy/queue-worker.conf
# Supervisor config for Laravel queue workers.
# Copy to /etc/supervisor/conf.d/oceanovia-worker.conf

[program:oceanovia-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/oceanovia/artisan queue:work redis --queue=high,default,low,media --sleep=3 --tries=3 --max-time=3600
directory=/var/www/oceanovia
numprocs=2
autostart=true
autorestart=true
stopwaitsecs=3600
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/oceanovia/storage/logs/queue-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
